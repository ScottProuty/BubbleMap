<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BubbleMap</title>
<link rel="stylesheet" href="src/Styles.css">
</head>
<body>
  <div id="toolbar">
    <button id="addBubbleBtn" title="Add Bubble">+</button>
    <button id="SettingsBtn">Settings</button>
    <button id="doneListBtn">Done List</button>
  </div>

  <div id="canvas">
    <svg id="linksLayer"></svg>
    <div id="world"></div>
  </div>

  <div id="doneListOverlay" class="hidden">
    <div id="doneListModal">
      <button id="doneListCloseBtn" class="close-btn" title="Close">&times;</button>
      <h2>Done List</h2>
      <ul id="doneListItems"></ul>
    </div>
  </div>

  <div id="settingsOverlay" class="hidden">
    <div id="settingsModal">
      <button id="settingsCloseBtn" class="close-btn" title="Close">&times;</button>
      <h2>Settings</h2>
      <div id="settingsBody">
        <!--
          SETTINGS FRAMEWORK
          Add each new setting as its own ".settings-row" here, then wire it up in
          src/settings.js (see the comment there for the full checklist).

          Example row:
            <div class="settings-row">
              <label for="exampleSetting">Example Setting</label>
              <input type="checkbox" id="exampleSetting">
            </div>
        -->
        <div class="settings-row">
          <label for="showCompletedSetting">Show Completed</label>
          <input type="checkbox" id="showCompletedSetting">
        </div>
        <div class="settings-row">
          <label for="themeSettingMenu">Theme:</label>
          <select name="themeSetting" id="themeSettingMenu">
            <option>Rainbow</option>
            <option>Pastel</option>
            <option>Mono Blue</option>
            <option>Sunset</option>
            <option>Muted</option>
            <option>Vibrant</option>
          </select>
        </div>
        <div class="settings-row">
          <label for="repelForceSettingMenu">Repel Force</label>
          <select name="repelForceSetting" id="repelForceSettingMenu">
            <option value="140">Low</option>
            <option value="180">Med</option>
            <option value="210">High</option>
          </select>
        </div>
        <div class="settings-row">
          <label for="maxDistanceSettingMenu">Max Distance</label>
          <select name="maxDistanceSetting" id="maxDistanceSettingMenu">
            <option value="380">Low</option>
            <option value="420">Med</option>
            <option value="460">High</option>
          </select>
        </div>
        <div class="settings-row">
          <label for="linkDistanceSettingMenu">Link Distance</label>
          <select name="linkDistanceSetting" id="linkDistanceSettingMenu">
            <option value="100">Low</option>
            <option value="140">Med</option>
            <option value="170">High</option>
          </select>
        </div>
      </div>
      <div class="settings-actions">
        <button id="saveBackupBtn" class="settings-btn">Save Backup</button>
        <button id="recallBackupBtn" class="settings-btn">Recall Backup</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/BubbleMap.js"></script>
</body>
</html>
